<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1b3f2f" />
      <stop offset="45%" stop-color="#143024" />
      <stop offset="85%" stop-color="#0a1913" />
      <stop offset="100%" stop-color="#050d0a" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="30%" stop-color="#DFBE72" />
      <stop offset="70%" stop-color="#C6A45A" />
      <stop offset="100%" stop-color="#8F6C27" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#ringBg)" />

  <!-- Subtle ornamental border -->
  <rect x="25" y="25" width="750" height="750" rx="16" fill="none" stroke="#C6A45A" stroke-width="1.5" stroke-opacity="0.35" />
  <rect x="35" y="35" width="730" height="730" rx="12" fill="none" stroke="#E66C32" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4,4" />

  <!-- Soft Warm Light Center -->
  <circle cx="400" cy="380" r="220" fill="#E66C32" opacity="0.12" filter="url(#glow)" />

  <!-- Hands Holding Illustration (Geometric luxury stylized) -->
  <g transform="translate(0, -20)">
    <!-- Groom hand base -->
    <path d="M 180 560 Q 260 480 340 430 Q 380 400 440 390 L 460 410 Q 390 440 330 480 Q 250 540 210 650 Z" fill="#6A4533" opacity="0.85" />
    
    <!-- Bride hand interlaced -->
    <path d="M 620 570 Q 530 480 450 420 Q 400 390 350 400 L 330 380 Q 400 360 480 410 Q 560 470 600 660 Z" fill="#7D4F39" opacity="0.9" />

    <!-- Fingers gently touching -->
    <ellipse cx="400" cy="390" rx="45" ry="25" transform="rotate(-15 400 390)" fill="#7D4F39" opacity="0.7" />
    
    <!-- Golden Wedding Ring 1 (Benjamin) -->
    <g transform="translate(370, 395) rotate(-25)">
      <ellipse cx="0" cy="0" rx="42" ry="22" fill="none" stroke="url(#goldGradient)" stroke-width="8" filter="url(#glow)" />
      <ellipse cx="0" cy="0" rx="42" ry="22" fill="none" stroke="#FFE8A3" stroke-width="2" />
    </g>

    <!-- Golden Wedding Ring 2 (Carole - Intertwined) -->
    <g transform="translate(425, 385) rotate(15)">
      <ellipse cx="0" cy="0" rx="36" ry="19" fill="none" stroke="url(#goldGradient)" stroke-width="7" filter="url(#glow)" />
      <ellipse cx="0" cy="0" rx="36" ry="19" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8" />
      <!-- Solitaire Diamond shimmer -->
      <polygon points="0,-19 -6,-28 0,-34 6,-28" fill="#FFFFFF" filter="url(#glow)" />
      <circle cx="0" cy="-28" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#DFBE72">
    <path d="M 425 340 L 428 350 L 438 353 L 428 356 L 425 366 L 422 356 L 412 353 L 422 350 Z" opacity="0.9" />
    <path d="M 360 420 L 362 426 L 368 428 L 362 430 L 360 436 L 358 430 L 352 428 L 358 426 Z" opacity="0.75" />
    <circle cx="470" cy="360" r="2" opacity="0.6" />
    <circle cx="330" cy="370" r="2" opacity="0.6" />
  </g>

  <!-- Labels -->
  <text x="400" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="url(#goldGradient)">L'ALLIANCE &amp; LA PROMESSE</text>
  <text x="400" y="715" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="3" fill="#FAF5EE" opacity="0.75">DEUX CŒURS, UNE SEULE ÂME</text>
</svg>
